services:
  - type: web
    name: gsc-announcement-backend
    env: node
    # keep rootDir so Render can operate in the backend folder when supported
    rootDir: backend
    # Use explicit --prefix to ensure Render runs npm inside the backend folder
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
